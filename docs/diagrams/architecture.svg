<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="gt-arch-title gt-arch-desc" class="gt-arch-map">
<title id="gt-arch-title">git-tools architecture</title>
<desc id="gt-arch-desc">Purple components are built in this project: git-proxy, source VFS, output VFS, local-cas and the Linux agent-session orchestrator. Gray components are external. Cylinders are storage. Each agent owns writable source and output state; host dependencies and the proxy are shared. Bazel sends Execute to the BuildBuddy execution service, which schedules tasks onto workers. Optional background CAS upload is dashed.</desc>
<style>
.gt-arch-map{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fafbf8;color:#293241}
.gt-arch-map text{fill:#293241}.gt-arch-map .gt-arch-scope{fill:#f2f4f2;stroke:#d4d9d5;stroke-width:1.5}.gt-arch-map .gt-arch-agent{fill:#fffefa;stroke:#aab4ae;stroke-width:1.5;stroke-dasharray:7 5}.gt-arch-map .gt-arch-cloud{fill:#f2f4f7;stroke:#c8d0da;stroke-width:1.5}
.gt-arch-map .gt-arch-node .gt-arch-shape{fill:#f5f6f8;stroke:#9aa6b5;stroke-width:1.6}.gt-arch-map .gt-arch-node.gt-arch-ours .gt-arch-shape{fill:#eee8ff;stroke:#8064b2;stroke-width:1.8}.gt-arch-map .gt-arch-ours .gt-arch-title{fill:#422c6a}
.gt-arch-map .gt-arch-heading{font-size:16px;font-weight:700;letter-spacing:.8px}.gt-arch-map .gt-arch-title{font-size:23px;font-weight:700}.gt-arch-map .gt-arch-body{font-size:17px;fill:#586575}.gt-arch-map .gt-arch-note{font-size:16px;fill:#586575}.gt-arch-map .gt-arch-edge{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linejoin:round}.gt-arch-map .gt-arch-edge.gt-arch-optional{stroke:#a66b16;stroke-dasharray:7 5}.gt-arch-map .gt-arch-edge-label rect{fill:#fafbf8;stroke:none}.gt-arch-map .gt-arch-edge-label text{font-weight:550;font-size:17px}.gt-arch-map [data-flow]{transition:opacity .12s}.gt-arch-map.gt-arch-focused [data-flow]{opacity:.23}.gt-arch-map.gt-arch-focused [data-flow].gt-arch-active{opacity:1}.gt-arch-map .gt-arch-legend{font-size:17px}
@media(prefers-reduced-motion:reduce){.gt-arch-map [data-flow]{transition:none}}
</style>
