<title id="architecture-title">git-tools high-level architecture</title><desc id="architecture-description">Purple nodes are git-tools components in the workspace daemon; gray nodes are external tools or services. Bazel reads source and output mounts and sends RPCs through the proxy. Execute requests reach a remote scheduler before the worker stack. Mounts and the proxy share a local CAS. Cylinders represent storage. Logical request paths, not a deployment topology.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 447.71)">
