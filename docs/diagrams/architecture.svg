<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 980" role="img" aria-labelledby="gt-arch-title gt-arch-desc" class="gt-arch-map">
<title id="gt-arch-title">git-tools shared daemon architecture</title>
<desc id="gt-arch-desc">Purple components are built here; gray components are external. Each agent has private writable source and output namespaces and its own Bazel server, outside the shared workspace daemon. One per-user daemon serves source and output mounts, Git proxy and REAPI cache proxy, backed by one LRU-evicted local CAS and an optional in-memory Action Cache. Dirty edits are not eviction candidates. Bazel sends Execute directly to BuildBuddy's execution service and scheduler, which dispatches to plural workers. The cache proxy fronts BuildBuddy Action Cache and CAS; dashed arrows show optional background Git blob uploads. Cylinders are storage.</desc>
