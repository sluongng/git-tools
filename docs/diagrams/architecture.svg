<title id="architecture-title">git-tools high-level architecture</title><desc id="architecture-description">Purple nodes are git-tools components or managed storage; gray nodes are external. The Git proxy and its cache can run separately from the workspace daemon, which hosts lazy source/output mounts, RPC forwarding and a shared local CAS. Embedding the Git proxy remains an optional convenience mode. Execute requests pass through the local proxy and remote scheduler before workers. Cylinders are storage. Logical request paths, not a deployment topology.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 497.71)">
