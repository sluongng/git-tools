[package]
name = "bes-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable asynchronous Build Event Service relay"

[dependencies]
anyhow = "1"
async-stream = "0.3"
fjall = "=3.1.12"
futures-core = "0.3"
libc = "0.2"
prost = "0.14"
reapi = { path = "../reapi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "gzip"] }

[dev-dependencies]
tempfile = "3"
