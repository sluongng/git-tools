[package]
name = "tinytree-git"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded public-parent-only native repository export to local Git"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
private-fs = { path = "../private-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tinytree-client = { path = "../tinytree-client" }
tinytree-model = { path = "../tinytree-model" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }

[[bin]]
name = "tinytree-git"
path = "src/main.rs"
