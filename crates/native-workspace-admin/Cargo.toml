[package]
name = "native-workspace-admin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private external administration for lazy native jj workspaces"

[dependencies]
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
getrandom = "0.3"
jj-lib = { version = "=0.46.0", default-features = false }
jj-vfs = { path = "../jj-vfs" }
native-broker = { path = "../native-broker" }
private-fs = { path = "../private-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
output-core = { path = "../output-core" }
native-vfs-controller = { path = "../native-vfs-controller" }
native-workspace = { path = "../native-workspace" }
jj-native-index = { path = "../jj-native-index" }
jj-native-backend = { path = "../jj-native-backend" }
tinytree-cloud = { path = "../tinytree-cloud" }
tinytree-model = { path = "../tinytree-model" }
async-trait = "0.1"
tinytree-client = { path = "../tinytree-client" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[dev-dependencies]
native-vfs = { path = "../native-vfs" }
tonic = { version = "0.14", features = ["zstd"] }
tempfile = "3"
