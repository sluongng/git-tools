[package]
name = "workspace-overlay"
version = "0.1.0"
edition = "2024"
description = "Persistent mutable Git workspace namespaces and native Git worktree integration"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
fjall = "=3.1.12"
workspace-core = { path = "../workspace-core" }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
