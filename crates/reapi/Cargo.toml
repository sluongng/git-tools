[package]
name = "reapi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pinned Remote Execution API and ByteStream bindings"

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
fastrand = "2"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "rt", "macros", "net"] }
toml = "1.1"
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
zstd = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
