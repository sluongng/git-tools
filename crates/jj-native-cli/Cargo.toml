[package]
name = "jj-native-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Jujutsu command-line entry point for native Tinytree repositories"

[features]
default = []
protocol-fixture = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
private-fs = { path = "../private-fs" }
workspace-daemon = { path = "../workspace-daemon" }
native-workspace-admin = { path = "../native-workspace-admin" }
native-vfs-rpc = { path = "../native-vfs-rpc" }
jj-vfs = { path = "../jj-vfs" }
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
jj-cli = { version = "=0.46.0", default-features = false }
jj-lib = { version = "=0.46.0", default-features = false }
jj-native-index = { path = "../jj-native-index" }
jj-native-backend = { path = "../jj-native-backend" }
native-broker = { path = "../native-broker" }
tinytree-model = { path = "../tinytree-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

tonic = { version = "0.14", features = ["zstd"] }

[dev-dependencies]
tinytree-cloud = { path = "../tinytree-cloud" }
native-capture-pack = { path = "../native-capture-pack" }
tinytree-index = { path = "../tinytree-index" }
tinytree-client = { path = "../tinytree-client" }
http = "1"
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
serde_json = "1"
toml = "1.1"
anyhow = "1"
async-trait = "0.1"
jj-native-remote = { path = "../jj-native-remote" }
local-cas = { path = "../local-cas" }
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }
tinytree-fixture = { path = "../tinytree-fixture" }
tinytree-model = { path = "../tinytree-model" }
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
native-broker = { path = "../native-broker" }
jj-native-backend = { path = "../jj-native-backend" }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "tinytree-jj"
path = "src/main.rs"
