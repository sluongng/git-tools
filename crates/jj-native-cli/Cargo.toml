[package]
name = "jj-native-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Jujutsu command-line entry point for native Tinytree storage"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jj-cli = { version = "=0.46.0", default-features = false }
jj-lib = { version = "=0.46.0", default-features = false }
jj-native-backend = { path = "../jj-native-backend" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tinytree-jj"
path = "src/main.rs"
