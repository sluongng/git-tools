[package]
name = "native-capture-pack"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded structural verification of local native capture packs"

[dependencies]
blake3 = "1"
private-fs = { path = "../private-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
