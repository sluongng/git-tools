[package]
name = "local-cas"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared verified CAS disk cache with lease-safe bounded LRU eviction"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
