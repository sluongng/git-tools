[package]
name = "jj-vfs"
version = "0.1.0"
edition = "2024"
description = "Jujutsu working-copy backend for lazy Git VFS projections"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
workspace-overlay = { path = "../workspace-overlay" }
jj-cli = { version = "=0.46.0", default-features = false, features = ["git"] }
jj-lib = { version = "=0.46.0", default-features = false, features = ["git"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xattr = "1"

[dev-dependencies]
tempfile = "3"

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-jj"
path = "src/main.rs"
