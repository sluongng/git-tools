[package]
name = "jj-vfs"
version = "0.1.0"
edition = "2024"
description = "Jujutsu working-copy backend for lazy Git VFS projections"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
private-fs = { path = "../private-fs" }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
jj-cli = { version = "=0.46.0", default-features = false, features = ["git"] }
jj-lib = { version = "=0.46.0", default-features = false, features = ["git"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
workspace-overlay = { path = "../workspace-overlay" }
rustix = { version = "1", features = ["fs"] }
xattr = "1"

[dev-dependencies]
tempfile = "3"
jj-native-backend = { path = "../jj-native-backend" }

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-jj"
path = "src/main.rs"
