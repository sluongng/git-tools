[package]
name = "jj-native-index"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "Immutable checkpoint-backed jj index over local broker queries"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
blake3 = "1"
fs2 = "0.4"
futures = "0.3"
jj-lib = { version = "=0.46.0", default-features = false }
jj-native-backend = { path = "../jj-native-backend" }
native-broker = { path = "../native-broker" }
private-fs = { path = "../private-fs" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tinytree-annotate = { path = "../tinytree-annotate" }
tinytree-proto = { path = "../tinytree-proto" }
tinytree-model = { path = "../tinytree-model" }
tinytree-cloud = { path = "../tinytree-cloud" }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tonic = "0.14"
uuid = { version = "1", features = ["v4"] }
