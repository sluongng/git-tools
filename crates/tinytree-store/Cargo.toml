[package]
name = "tinytree-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable native repository objects and compare-and-set references"

[dependencies]
packblob = { path = "../packblob" }
tinytree-model = { path = "../tinytree-model" }
tinytree-landing = { path = "../tinytree-landing" }
tinytree-cloud = { path = "../tinytree-cloud" }
blake3 = "1"
fjall = "=3.1.12"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
futures = "0.3"
jj-lib = { version = "=0.46.0", default-features = false }
zstd = "0.13"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
