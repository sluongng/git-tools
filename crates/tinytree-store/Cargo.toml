[package]
name = "tinytree-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable native repository objects and compare-and-set references"

[dependencies]
tinytree-model = { path = "../tinytree-model" }
blake3 = "1"
fjall = "=3.1.12"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
