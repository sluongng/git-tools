[package]
name = "git-vfs"
version = "0.1.0"
edition = "2024"
description = "Writable Git partial-clone filesystem with GITSHA1 xattrs and journal-backed status"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
git-workspace = { path = "../git-workspace" }
git-overlay = { path = "../git-overlay" }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
fjall = "=3.1.12"
tempfile = "3"
