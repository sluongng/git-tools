[package]
name = "tinytree-import"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded immutable Git snapshot and verified history import for native repositories"

[dependencies]
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
libc = "0.2"
private-fs = { path = "../private-fs" }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tinytree-client = { path = "../tinytree-client" }
tinytree-model = { path = "../tinytree-model" }
tonic = { version = "0.14", features = ["zstd", "tls-ring"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tinytree-git = { path = "../tinytree-git" }
toml = "1.1"
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }

[[bin]]
name = "tinytree-import"
path = "src/main.rs"
