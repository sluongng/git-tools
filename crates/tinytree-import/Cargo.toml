[package]
name = "tinytree-import"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded one-way immutable Git snapshot seeding for native repositories"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tinytree-client = { path = "../tinytree-client" }
tinytree-model = { path = "../tinytree-model" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
toml = "1.1"
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }

[[bin]]
name = "tinytree-import"
path = "src/main.rs"
