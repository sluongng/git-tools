[package]
name = "git-workspace"
version = "0.1.0"
edition = "2024"
description = "Git object access, immutable trees, and shared workspace metadata caches"
license = "MIT"

[dependencies]
anyhow = "1"
fjall = "=3.1.12"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
