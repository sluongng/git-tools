[package]
name = "tinytree-check-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded operator-trusted checks on immutable native source mounts"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
private-fs = { path = "../private-fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tinytree-check-runner"
path = "src/main.rs"
