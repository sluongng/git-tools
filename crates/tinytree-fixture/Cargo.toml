[package]
name = "tinytree-fixture"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic native repository fixtures for Tinytree"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinytree-model = { path = "../tinytree-model" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tinytree-fixture"
path = "src/main.rs"
