[package]
name = "output-nfs"
version = "0.1.0"
edition = "2024"
description = "Lazy CAS output projection over loopback NFSv3"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
nfsserve = "=0.11.0"
output-core = { path = "../output-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
