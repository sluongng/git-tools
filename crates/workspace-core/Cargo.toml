[package]
name = "workspace-core"
version = "0.1.0"
edition = "2024"
description = "Git object access, immutable trees, and shared workspace metadata caches"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
local-cas = { path = "../local-cas" }
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
fjall = "=3.1.12"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
