[package]
name = "workspace-nfs"
version = "0.1.0"
edition = "2024"
description = "Loopback NFSv3 projection of a writable lazy Git workspace"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
workspace-overlay = { path = "../workspace-overlay" }
workspace-core = { path = "../workspace-core" }
libc = "0.2"
nfsserve = { version = "=0.11.0", path = "../../third_party/nfsserve" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-nfs"
path = "src/main.rs"
