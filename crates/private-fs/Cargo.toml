[package]
name = "private-fs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Owner-private native storage directories and publication primitives"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile = "3"
