syntax = "proto3";
package native.broker.v1;
import "tinytree/query/v1/query.proto";

// Private local daemon protocol. Store IDs select configured handles, not paths.
// No Git service, remote retention promise or jj operation log is shared here.
service ObjectIo {
  rpc Descriptor(ObjectRequest) returns (DescriptorReply);
  rpc ReadMetadata(ObjectRequest) returns (Metadata);
  rpc WriteMetadata(MetadataWrite) returns (ObjectDescriptor);
  rpc ReadFile(ObjectRequest) returns (stream ReadFrame);
  rpc WriteFile(stream WriteFrame) returns (ObjectDescriptor);
  rpc CopyCatalog(CatalogRequest) returns (stream CatalogFrame);
}
message ObjectRequest { string store_id = 1; uint32 kind = 2; bytes id = 3; }
message ObjectDescriptor { uint32 kind = 1; bytes id = 2; uint64 size_bytes = 3; uint32 format_version = 4; }
message DescriptorReply { optional ObjectDescriptor descriptor = 1; }
message Metadata { ObjectDescriptor descriptor = 1; bytes canonical = 2; }
message MetadataWrite { string store_id = 1; bytes canonical = 2; }
message Chunk { uint64 offset = 1; bytes data = 2; }
message Complete { uint64 count = 1; uint64 size_bytes = 2; bytes digest = 3; }
message ReadFrame { oneof frame { ObjectDescriptor descriptor = 1; Chunk chunk = 2; Complete complete = 3; } }
message WriteHeader { string store_id = 1; uint64 max_bytes = 2; }
message WriteFrame { oneof frame { WriteHeader header = 1; Chunk chunk = 2; bool complete = 3; } }
message CatalogRequest { string store_id = 1; uint64 max_objects = 2; uint64 max_bytes = 3; uint64 max_edges = 4; }
message CatalogFrame { oneof frame { Metadata entry = 1; Complete complete = 2; } }

// Separate optional host control for a configured alias. Expected generations
// are explicit caller workspace observations, never host-global latest values.
service RepositoryControl {
  rpc ObserveReference(ObserveReferenceRequest) returns (ReferenceSnapshot);
  rpc AdmitCommit(AdmitCommitRequest) returns (AdmittedCommit);
  rpc Publish(PublishRequest) returns (ConfirmedPublication);
  rpc Publication(PublicationRequest) returns (PublicationReply);
}
message ObserveReferenceRequest { string store_id = 1; string name = 2; }
message AdmitCommitRequest { string store_id = 1; bytes head = 2; }
message AdmittedCommit { bytes head = 1; uint64 metadata_objects = 2; }
message ReferenceSnapshot { string name = 1; uint64 generation = 2; optional AdmittedCommit head = 3; }
message PublishRequest {
  string store_id = 1; string name = 2; bytes head = 3;
  optional uint64 expected_generation = 4; string idempotency_key = 5;
}
message ConfirmedPublication { string idempotency_key = 1; string name = 2; uint64 generation = 3; bytes head = 4; }
message PublicationRequest { string store_id = 1; string idempotency_key = 2; }
message PublicationReply {
  // Absence is no confirmed receipt, not proof that upstream did not commit.
  optional ConfirmedPublication publication = 1;
}

// Immutable repository queries through the configured local alias. Handles are
// broker-local and never carry upstream connection settings or cursor tokens.
service QueryIo {
  rpc DescribeProvider(DescribeProviderRequest) returns (ProviderDescription);
  rpc OpenCloudScope(QueryOpenCloudScopeRequest) returns (QueryScopeReply);
  rpc OpenScope(QueryOpenScopeRequest) returns (QueryScopeReply);
  rpc ForkScope(QueryForkScopeRequest) returns (QueryScopeReply);
  rpc Facts(QueryFactsRequest) returns (tinytree.query.v1.GraphFacts);
  rpc ResolveCommitPrefix(QueryCommitPrefixRequest) returns (tinytree.query.v1.CommitPrefixResult);
  rpc ResolveChangePrefix(QueryChangePrefixRequest) returns (tinytree.query.v1.ChangePrefixResult);
  rpc ShortestPrefix(QueryShortestPrefixRequest) returns (tinytree.query.v1.ShortestPrefixResult);
  rpc Begin(QueryBeginRequest) returns (QueryHandleReply);
  rpc Page(QueryPageRequest) returns (QueryPageReply);
  rpc ReadCommit(QueryReadCommitRequest) returns (Metadata);
  rpc PathHistory(QueryPathRequest) returns (tinytree.query.v1.PathHistoryResult);
  rpc Blame(QueryPathRequest) returns (tinytree.query.v1.BlameResult);
  rpc Search(QuerySearchRequest) returns (tinytree.query.v1.SearchResult);
  rpc CloseQuery(QueryCloseRequest) returns (QueryCloseReply);
  rpc CloseScope(QueryCloseRequest) returns (QueryCloseReply);
}
message NativeCloudQuerySource {
  bytes provider_identity = 1;
  bytes workspace_id = 2;
  uint64 generation = 3;
  bytes manifest_id = 4;
  bytes manifest_blake3 = 5;
  uint64 manifest_size_bytes = 6;
  repeated bytes index_root_ids = 7;
  repeated bytes expected_anchors = 8; // Assertions, never upstream root grants.
}
message QueryOpenCloudScopeRequest {
  string store_id = 1;
  NativeCloudQuerySource source = 2;
  repeated bytes overlay = 3;
  bytes replay_key = 4;
}
message QueryOpenScopeRequest {
  string store_id = 1; repeated bytes roots = 2;
  repeated bytes overlay = 3; bytes replay_key = 4;
  uint32 query_identity_version = 5; // 0/1 legacy; 2 scope-bound identities.
}
message QueryForkScopeRequest {
  string store_id = 1; bytes parent = 2;
  repeated bytes overlay = 3; bytes replay_key = 4;
  optional bytes expected_cloud_source_digest = 5;
}
message QueryScopeReply {
  bytes handle = 1; int64 expires_at_unix_seconds = 2;
  uint32 query_identity_version = 3;
  optional bytes cloud_source_digest = 4;
}
message QueryFactsRequest {
  string store_id = 1; bytes scope = 2;
  repeated tinytree.query.v1.GraphFact facts = 3;
}
message QueryCommitPrefixRequest { string store_id = 1; bytes scope = 2; string hex_prefix = 3; tinytree.query.v1.GraphExpr selection = 4; }
message QueryChangePrefixRequest {
  string store_id = 1; bytes scope = 2; string hex_prefix = 3;
  repeated bytes visible_heads = 4;
  tinytree.query.v1.GraphExpr selection = 5;
}
message QueryShortestPrefixRequest {
  string store_id = 1; bytes scope = 2;
  oneof target { bytes commit = 3; bytes change = 4; }
  repeated bytes visible_heads = 5;
  tinytree.query.v1.GraphExpr selection = 6;
}
message QueryBeginRequest {
  string store_id = 1; bytes scope = 2;
  tinytree.query.v1.GraphExpr expression = 3;
  tinytree.query.v1.Projection projection = 4;
  uint32 page_size = 5; bytes replay_key = 6;
}
message QueryHandleReply { bytes handle = 1; int64 expires_at_unix_seconds = 2; }
message QueryPageRequest { string store_id = 1; bytes query = 2; uint64 expected_sequence = 3; }
message QueryPageReply {
  uint64 sequence = 1; repeated tinytree.query.v1.GraphRow rows = 2;
  optional bool exhausted = 3; // Required; cancellation is not EOF.
}
message QueryReadCommitRequest { string store_id = 1; bytes scope = 2; bytes commit = 3; }
// Only broker-local scope handles cross this facade. The host resolves the
// captured upstream source; this request cannot supply upstream scope keys.
message QueryPathRequest {
  string store_id = 1;
  bytes scope = 2;
  bytes revision = 3;
  string path = 4;
  tinytree.query.v1.HistoryPolicy policy = 5;
  uint32 max_commits = 6;
}
// Search cursors are provider-owned local envelopes, not upstream handles.
message QuerySearchRequest {
  string store_id = 1;
  bytes scope = 2;
  bytes revision = 3;
  bytes pattern = 4;
  string path_prefix = 5;
  tinytree.query.v1.SearchPolicy policy = 6;
  uint32 page_size = 7;
  bytes cursor = 8;
}
message QueryCloseRequest { string store_id = 1; bytes handle = 2; }
message QueryCloseReply {}

// Local opaque identity and creation policy only. No upstream connection or
// authorization settings cross this owner-private transport boundary.
enum ProviderIndexMode { PROVIDER_INDEX_MODE_UNSPECIFIED = 0; LEGACY = 1; FEDERATED = 2; }
message DescribeProviderRequest { string store_id = 1; }
message ProviderDescription {
  string store_id = 1;
  bytes identity = 2; // Exactly 32 nonzero opaque daemon-computed bytes.
  optional bool query_capable = 3;
  ProviderIndexMode index_mode = 4;
}
