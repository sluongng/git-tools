[package]
name = "native-vfs-rpc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private bounded native projection controller transport"

[features]
protocol-test-support = ["native-vfs-controller/protocol-test-support"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
bytes = "1"
blake3 = "1"
futures = "0.3"
grpc-transport = { path = "../grpc-transport" }
http = "1"
http-body = "1"
jj-lib = { version = "=0.46.0", default-features = false }
jj-vfs = { path = "../jj-vfs" }
native-broker = { path = "../native-broker" }
native-vfs-controller = { path = "../native-vfs-controller" }
prost = "0.14"
reapi = { path = "../reapi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["zstd"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
private-fs = { path = "../private-fs" }
jj-native-backend = { path = "../jj-native-backend" }
native-workspace = { path = "../native-workspace" }
output-core = { path = "../output-core" }
local-cas = { path = "../local-cas" }
tinytree-model = { path = "../tinytree-model" }
