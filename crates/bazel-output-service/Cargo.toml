[package]
name = "bazel-output-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bazel Remote Output Service with a BuildBuddy-compatible CAS backend"

[dependencies]
reapi = { path = "../reapi" }
output-core = { path = "../output-core" }
local-cas = { path = "../local-cas" }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
sha2 = "0.10"
serde_json = "1"
cap-std = "3"
cap-fs-ext = "3"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "gzip"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
output-nfs = { path = "../output-nfs" }

[target.'cfg(target_os = "linux")'.dependencies]
output-fuse = { path = "../output-fuse" }

[target.'cfg(windows)'.dependencies]
output-projfs = { path = "../output-projfs" }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
h2 = "0.4"
http = "1"
bytes = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-output-service"
path = "src/main.rs"
