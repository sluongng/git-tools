[package]
name = "bazel-output-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bazel Remote Output Service with a BuildBuddy-compatible CAS backend"

[dependencies]
reapi = { path = "../reapi" }
anyhow = "1"
blake3 = "1"
sha2 = "0.10"
cap-std = "3"
cap-fs-ext = "3"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-output-service"
path = "src/main.rs"
