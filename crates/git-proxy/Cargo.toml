[package]
name = "git-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only native Git pull-through cache and object metadata service"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
fjall = "=3.1.12"
fs2 = "0.4"
flate2 = "1"
futures-core = "0.3"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
