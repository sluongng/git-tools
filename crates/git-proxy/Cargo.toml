[package]
name = "git-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only native Git pull-through cache and object metadata service"

[dependencies]
local-cas = { path = "../local-cas" }
async-trait = "0.1"
git-pack-cache = { path = "../git-pack-cache" }
reapi = { path = "../reapi" }
anyhow = "1"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
fjall = "=3.1.12"
fs2 = "0.4"
flate2 = "1"
futures-core = "0.3"
fastcdc = "=4.0.0"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "gzip"] }
prost = "0.14"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
