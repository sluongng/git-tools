[package]
name = "tinytree-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Verified native jj operation and view recovery objects"

[dependencies]
tinytree-model = { path = "../tinytree-model" }
blake3 = "1"
jj-lib = { version = "=0.46.0", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
