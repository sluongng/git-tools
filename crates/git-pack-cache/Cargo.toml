[package]
name = "git-pack-cache"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded smart HTTP Git fetch response cache"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
blake3 = "1"
bytes = "1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
