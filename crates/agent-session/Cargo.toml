[package]
name = "agent-session"
version = "0.1.0"
edition = "2024"
description = "Private, resumable Linux Git VFS sessions for Bazel coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
