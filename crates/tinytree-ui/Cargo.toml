[package]
name = "tinytree-ui"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "WebAssembly repository browser for tinytree"

[lib]
path = "src/lib.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
