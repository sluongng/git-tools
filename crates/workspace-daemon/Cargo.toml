[package]
name = "workspace-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One host service for private coding workspaces and a shared REAPI cache"

[[bin]]
name = "workspace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
agent-session = { path = "../agent-session" }
bazel-output-service = { path = "../bazel-output-service" }
axum = "0.8"
git-proxy = { path = "../git-proxy" }
cache-proxy = { path = "../cache-proxy" }
bes-proxy = { path = "../bes-proxy" }
blake3 = "1"
local-cas = { path = "../local-cas" }
reapi = { path = "../reapi" }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
workspace-fuse = { path = "../workspace-fuse" }
workspace-core = { path = "../workspace-core" }

[dev-dependencies]
tempfile = "3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
