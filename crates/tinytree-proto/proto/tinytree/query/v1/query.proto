syntax = "proto3";

package tinytree.query.v1;

import "tinytree/v1/repository.proto";
import "tinytree/cloud/v1/cloud.proto";

// Experimental derived-index contract, separate from authoritative object I/O.
// Bindings alone provide no authentication, validation, retention or resource
// policy. Servers MUST authorize before inspecting IDs and recheck repository,
// principal and scope ownership on every RPC; opaque handles are not credentials.
// Scope installation/query execution require bounded admission before work or
// allocation. Accepted physical jobs retain their guards after cancellation.
service RepositoryQuery {
  rpc OpenScope(stream OpenScopeFrame) returns (QueryScope);
  rpc OpenCloudScope(stream OpenScopeFrame) returns (QueryScope);
  rpc ForkScope(stream ForkScopeFrame) returns (QueryScope);
  rpc CloseScope(CloseScopeRequest) returns (CloseScopeResponse);
  rpc QueryFacts(QueryFactsRequest) returns (GraphFacts);
  rpc ResolveCommitPrefix(ResolveCommitPrefixRequest) returns (CommitPrefixResult);
  rpc ResolveChangePrefix(ResolveChangePrefixRequest) returns (ChangePrefixResult);
  rpc ShortestPrefix(ShortestPrefixRequest) returns (ShortestPrefixResult);
  rpc Evaluate(EvaluateRequest) returns (EvaluatePage);
  rpc CloseQuery(CloseQueryRequest) returns (CloseQueryResponse);
  rpc PathHistory(PathHistoryRequest) returns (PathHistoryResult);
  rpc Blame(BlameRequest) returns (BlameResult);
  rpc Search(SearchRequest) returns (SearchResult);
}

message CommitId { bytes value = 1; } // Exactly 32 bytes; zero is intrinsic root.
message ChangeId { bytes value = 1; } // Exactly 16 bytes, not a commit identity.
message ScopeKey {
  string repository_id = 1;
  bytes handle = 2; // Opaque 32-byte handle, never an authorization credential.
}
message QueryScope {
  ScopeKey key = 1;
  bytes content_digest = 2; // Exactly 32 bytes, immutable logical scope identity.
  bytes index_epoch = 3; // Exactly 16 bytes, durable index incarnation.
  uint64 high_water = 4;
  int64 expires_at_unix_seconds = 5; // Absolute expiry, not sliding access TTL.
  bytes cloud_source_binding = 8; // Mandatory32 for cloud scopes, empty for legacy.
  uint32 query_identity_version = 7; // 1 legacy; 2 scope-bound query identities.
}

// Version 1 preserves legacy arbitrary query IDs. Version 2 explicitly requires
// query_id = nonce16 || BLAKE3("tinytree-query-scope-id-v2\0" ||
// u64BE(repository UTF-8 byte length) || repository || exact scope handle32 ||
// nonce16)[0..16]. This public binding is not authentication. Explicitly closed
// v2 query history can be retired once its scope is closed. Server-established
// unclosed queries and final-page replay remain valid until original expiry;
// SDK-only preparation does not establish a server query. Identity mode is part
// of the namespace: legacy v1 may reuse raw bytes after v2 history is retired.
// Old v2 requests cannot reopen their closed scope or rebind to another v2 scope.
// No version downgrade fallback.
// Roots are sorted unique authoritative remote checkpoint
// IDs, never private draft heads. The logical graph is their complete ancestry
// union every admitted private draft, including hidden/divergent siblings.
// Declared overlay totals count only this stream's additions, not shared ancestry.
// Replay binds principal/repository/version/roots/canonical overlay contents;
// identical replay is idempotent, differing content under the same key errors.
// Fork also binds the exact parent scope, never a moving/latest reference.
// Overlay commits are parent-first: each parent is an earlier overlay node, an
// inherited private draft, or a member of the complete remote scoped graph.
// Private overlay objects never become authoritative repository uploads merely
// by opening a query scope. Validate canonical identities and
// totals before installing atomically; this is not a backup/offload ACK.
message ScopeHeader {
  uint32 version = 1;
  string repository_id = 2;
  bytes replay_key = 3;
  repeated CommitId roots = 4;
  uint64 overlay_object_count = 5;
  uint64 overlay_bytes = 6;
  CloudSnapshotSource cloud_source = 7;
}
message ForkScopeHeader {
  ScopeHeader scope = 1;
  ScopeKey parent_scope = 2; // Same repository/principal; share immutable nodes.
  // Ordinary scope.roots must equal the parent's remote roots. Cloud forks
  // require empty roots and absent cloud_source, inheriting the exact parent.
  // Use an explicit Open method for a new base; mixed sources are unsupported.
}
message OverlayCommitHeader {
  tinytree.v1.ObjectDescriptor descriptor = 1; // Non-root COMMIT only.
}
message OverlayCommitEnd {
  uint64 size_bytes = 1;
  bytes content_blake3 = 2; // Must match header and exact contiguous bytes.
}
message ScopeEnd {
  uint64 overlay_object_count = 1;
  uint64 overlay_bytes = 2; // Exact totals matching header and completed objects.
}
// Exactly one header first; then zero or more (commit, contiguous bounded chunks,
// commit_end) groups; exactly one scope_end last followed by clean EOF. Missing,
// duplicate, reordered, truncated or trailing frames error, including an unset
// oneof. Header totals, frame sizes, roots, canonical decoding and full stream
// bytes need explicit server limits; generated bindings enforce none of them.
message OpenScopeFrame {
  oneof frame {
    ScopeHeader header = 1;
    OverlayCommitHeader commit = 2;
    tinytree.v1.DataChunk chunk = 3;
    OverlayCommitEnd commit_end = 4;
    ScopeEnd scope_end = 5;
  }
}
message ForkScopeFrame {
  oneof frame {
    ForkScopeHeader header = 1;
    OverlayCommitHeader commit = 2;
    tinytree.v1.DataChunk chunk = 3;
    OverlayCommitEnd commit_end = 4;
    ScopeEnd scope_end = 5;
  }
}
message CloseScopeRequest { ScopeKey scope = 1; }
message CloseScopeResponse {}

// Release one query without draining its remaining results. Cancellation is not
// proof of exhaustion and never releases durable repository retention holds.
// Bind the identity to the authenticated caller, repository and exact scope.
// An idempotent close also records bounded cancellation before the first
// Evaluate arrives, preventing late requests from recreating a cancelled query.
// Closed identities remain closed until their absolute expiry. Accepted physical
// jobs and response bodies retain their resource owners until actual teardown.
message CloseQueryRequest {
  ScopeKey scope = 1;
  bytes query_id = 2; // Exactly 32 bytes, identical to Evaluate.query_id.
}
message CloseQueryResponse {}

message HasId { CommitId commit = 1; }
message IsAncestor { CommitId ancestor = 1; CommitId descendant = 2; }
message Heads { repeated CommitId commits = 1; }
message CommonAncestors { repeated CommitId left = 1; repeated CommitId right = 2; }
// Stateless membership never creates a cursor or a query replay record.
message Membership { GraphExpr expression = 1; CommitId candidate = 2; }
message GraphFact {
  oneof fact {
    HasId has_id = 1;
    IsAncestor is_ancestor = 2;
    Heads heads = 3;
    CommonAncestors common_ancestors = 4;
    Membership membership = 5;
  }
}
message CommitSet { repeated CommitId commits = 1; }
message GraphFactAnswer {
  oneof answer {
    bool has_id = 1;
    bool is_ancestor = 2;
    CommitSet heads = 3;
    CommitSet common_ancestors = 4;
    bool membership = 5;
  }
}
message QueryFactsRequest { ScopeKey scope = 1; repeated GraphFact facts = 2; }
message GraphFacts {
  repeated GraphFactAnswer answers = 1; // Exact input order/count and variant.
  bytes scope_digest = 2;
  bytes index_epoch = 3;
}

message NoMatch {}
message CommitMatch { CommitId commit = 1; }
message AmbiguousCommits {} // Exact ambiguity, not early budget exhaustion.
message ResolveCommitPrefixRequest {
  ScopeKey scope = 1;
  string hex_prefix = 2;
  optional GraphExpr selection = 3; // Absent preserves full-scope legacy behavior.
}
message CommitPrefixResult {
  oneof result {
    NoMatch no_match = 1;
    CommitMatch single = 2;
    AmbiguousCommits ambiguous = 3;
  }
  optional bytes selection_digest = 4;
}
message ChangeTarget {
  CommitId commit = 1;
  optional bool visible = 2; // Required; membership in ancestors(request.visible_heads).
}
message ChangeMatch {
  ChangeId change = 1;
  // All matching divergent targets in the requested selection, or the complete
  // scope when selection is absent. Ambiguity counts distinct ChangeIds.
  repeated ChangeTarget targets = 2;
}
message AmbiguousChanges {} // Multiple distinct ChangeIds, not divergent commits.
message ResolveChangePrefixRequest {
  ScopeKey scope = 1;
  string hex_prefix = 2;
  repeated CommitId visible_heads = 3; // Explicit; never use ambient latest refs.
  optional GraphExpr selection = 4;
}
message ChangePrefixResult {
  oneof result {
    NoMatch no_match = 1;
    ChangeMatch single = 2;
    AmbiguousChanges ambiguous = 3;
  }
  optional bytes selection_digest = 4;
}
message ShortestPrefixRequest {
  ScopeKey scope = 1;
  oneof target {
    CommitId commit = 2;
    ChangeId change = 3;
  }
  repeated CommitId visible_heads = 4;
  optional GraphExpr selection = 5;
}
enum PrefixKind { PREFIX_KIND_UNSPECIFIED = 0; COMMIT_PREFIX = 1; CHANGE_PREFIX = 2; }
message ShortestPrefixResult {
  PrefixKind kind = 1;
  uint32 hex_length = 2; // Exact shortest unique length; zero is valid for a singleton.
  // Required iff a selection was supplied. False requires hex_length=0 and
  // means no selected target, not a guessed length/global fallback answer.
  optional bool in_selection = 3;
  optional bytes selection_digest = 4;
}

// Selected prefix responses MUST include selection_digest = BLAKE3(
// "tinytree-query-prefix-selection-v1\0" || canonical known GraphExpr protobuf).
// Legacy absent-selection responses omit this field. Clients must reject a
// missing/wrong digest, including old servers silently ignoring selection.
// Structural AST, not executable text. Every node version MUST equal 1. Servers
// bound depth/nodes/literal IDs/decoded bytes before execution and all subsequent
// scanned nodes/edges/frontier/replay memory. Unsupported operations return
// UNIMPLEMENTED; clients must not silently hydrate complete local history.
message GraphExpr {
  uint32 version = 1;
  oneof expression {
    CommitSet commits = 2;
    AncestorsExpr ancestors = 3;
    RangeExpr range = 4;
    DagRangeExpr dag_range = 5;
    UnaryExpr heads = 6;
    UnaryExpr roots = 7;
    SetExpr union = 8;
    SetExpr intersection = 9;
    DifferenceExpr difference = 10;
    LatestExpr latest = 11;
    // Canonical root-tree merge has multiple terms. This is metadata-only,
    // not a file-content conflict scan and not the commit parent count.
    UnaryExpr has_conflict = 12;
  }
}
// Half-open intervals. Absent end_exclusive means unbounded; present zero is
// distinct from absence. start <= end when end is present. Absent range messages
// mean all generations/parents. Generation zero is the seed itself; parent
// ranges select zero-based canonical parent indices at each traversal step.
message GenerationRange { uint64 start = 1; optional uint64 end_exclusive = 2; }
message ParentRange { uint32 start = 1; optional uint32 end_exclusive = 2; }
message AncestorsExpr { GraphExpr heads = 1; GenerationRange generations = 2; ParentRange parents = 3; }
// ancestors(heads) minus ancestors(roots), with generations measured from heads.
message RangeExpr {
  GraphExpr roots = 1;
  GraphExpr heads = 2;
  GenerationRange generations = 3;
  ParentRange parents = 4; // Filters traversal from heads, never from roots.
}
// descendants(roots) intersect ancestors(heads), including matching endpoints.
message DagRangeExpr {
  GraphExpr roots = 1;
  GraphExpr heads = 2;
  GenerationRange generations_from_roots = 3;
}
message UnaryExpr { GraphExpr input = 1; }
// Empty union is empty. Empty intersection is invalid, not an implicit request
// to enumerate the entire scoped graph.
message SetExpr { repeated GraphExpr inputs = 1; }
message DifferenceExpr { GraphExpr left = 1; GraphExpr right = 2; }
// Select at most count candidates by descending committer milliseconds, with
// frozen index position as the tie-breaker. Emit the selection topologically,
// NOT in timestamp order. Count zero is an empty set, not an absent limit.
message LatestExpr { GraphExpr candidates = 1; uint64 count = 2; }

enum Projection {
  PROJECTION_UNSPECIFIED = 0;
  IDS = 1; // Commit and ChangeId only; no selected edges or canonical payload.
  GRAPH = 2;
  CANONICAL = 3; // Graph row plus canonical commit payload, except intrinsic root.
}
message DirectEdge { CommitId target = 1; }
message IndirectEdge { CommitId target = 1; }
message MissingEdge { CommitId boundary = 1; }
message SelectedEdge {
  oneof edge {
    DirectEdge direct = 1;
    IndirectEdge indirect = 2;
    MissingEdge missing = 3;
  }
}
message GraphRow {
  CommitId commit = 1;
  ChangeId change = 2;
  // Selected-set edges, NOT unfiltered canonical parent summaries. Direct joins
  // a selected parent, indirect joins selected ancestry through omitted commits,
  // missing marks a branch without a selected destination at its boundary.
  repeated SelectedEdge edges = 3;
  // Descriptor/hash/decoded commit and ChangeId must match this row. Canonical
  // verification cannot prove completeness or detect omitted scoped results.
  tinytree.v1.ObjectData canonical = 4; // Presence only for requested canonical projection.
}
message EvaluateRequest {
  ScopeKey scope = 1;
  bytes query_id = 2; // Replay identity bound to immutable request inputs.
  GraphExpr expression = 3;
  Projection projection = 4;
  uint32 page_size = 5;
  bytes cursor = 6; // Absent/empty starts; nonempty is opaque server state/token.
}
message EvaluatePage {
  bytes scope_digest = 1;
  bytes index_epoch = 2;
  uint64 sequence = 3;
  repeated GraphRow rows = 4;
  bytes cursor = 5;
  optional bool exhausted = 6; // Must be present; false is not missing/unknown.
}

// Scope/query handles expire absolutely; restart invalidates handles. Clients
// reconstruct scopes from durable logical checkpoints, never ambient latest or
// truncated fetched objects. OpenScope may enqueue index warming and return
// UNAVAILABLE rather than synchronously hydrate complete ancestry.
//
// Facts, prefixes and shortest lengths are exact over COMPLETE scoped coverage.
// Missing coverage, unsupported work and exhausted budgets are errors, never
// false, NoMatch, ambiguity, empty complete results or guessed lengths. Incomplete
// queries cannot return exhausted=true. Server status distinguishes UNAVAILABLE
// (not ready), RESOURCE_EXHAUSTED (work/quotas), UNIMPLEMENTED and invalid inputs.
//
// Evaluate rows are globally children-before-parents across pages. Empty pages
// with continuation may represent bounded progress. exhausted=true iff complete,
// with empty cursor; exhausted=false requires a nonempty cursor. Stateful v1
// cursors bind principal/repo/scope digest/epoch/query inputs/page_size/sequence/
// expiry. Concurrent replay coalesces and progress commits with replayable page
// bytes. Old/expired cursor replay is FAILED_PRECONDITION, never another page.
// Limits/expiry cleanup, root pinning under GC, authorization, MACs, canonical
// verification and replay persistence are implementation obligations, not things
// this schema or generated bindings enforce.
// A started query retains its captured graph independently of CloseScope, up to
// its absolute expiry. Closing a scope prevents new queries; it does not revoke
// an accepted cursor or its replay identity. Continuations repeat the same AST,
// projection and page_size; changing any immutable input under query_id errors.

// Only OpenCloudScope accepts this source. Header.roots must be empty and
// identity version2. The server derives exact selected anchors, never drafts.
message CloudSnapshotSource {
  tinytree.cloud.v1.RetainedVersionSelector selector = 1;
  tinytree.cloud.v1.NativeVersionAuthority authority = 2;
  repeated bytes index_root_ids = 3; // Nonempty, strictly sorted unique32.
}


// Explicit fixed-path semantics: linear ancestry only, no copy/rename following.
// A merge or unresolved tree is a typed incomplete boundary, never first-parent
// attribution. The starting immutable commit must have canonical source authority
// in this exact scope; uploaded COMMIT-only overlays confer no FILE access.
enum HistoryPolicy {
  HISTORY_POLICY_UNSPECIFIED = 0;
  LINEAR_FIXED_PATH_V1 = 1;
}
enum HistoryCoverage {
  HISTORY_COVERAGE_UNSPECIFIED = 0;
  HISTORY_COMPLETE = 1;
  HISTORY_SCAN_LIMIT = 2;
  HISTORY_MERGE_BOUNDARY = 3;
  HISTORY_CONFLICT_BOUNDARY = 4;
  HISTORY_PRIVATE_OVERLAY = 5;
  HISTORY_READ_LIMIT = 6;
  HISTORY_DIFF_LIMIT = 7;
}
// Repo-relative UTF-8 path: nonempty slash-separated components, no empty,
// '.' or '..' components, backslashes, NUL or leading/trailing slash.
message PathHistoryRequest {
  ScopeKey scope = 1;
  CommitId revision = 2;
  string path = 3;
  HistoryPolicy policy = 4;
  uint32 max_commits = 5; // Zero uses server default; cannot raise server caps.
}
enum HistoryPathKind {
  HISTORY_PATH_KIND_UNSPECIFIED = 0;
  HISTORY_PATH_ABSENT = 1;
  HISTORY_PATH_FILE = 2;
  HISTORY_PATH_SYMLINK = 3;
  HISTORY_PATH_TREE = 4;
}
message HistoryPathState {
  HistoryPathKind kind = 1;
  bytes native_id = 2; // Empty for absent; exact32 otherwise. Not read authority.
  uint64 size_bytes = 3; // FILE byte length or symlink target length; zero for tree.
  bool executable = 4; // FILE only.
}
message PathHistoryEntry {
  CommitId commit = 1;
  HistoryPathState state = 2;
  HistoryPathState parent_state = 3;
}
message PathHistoryResult {
  bytes scope_digest = 1;
  bytes index_epoch = 2;
  CommitId revision = 3;
  string path = 4;
  HistoryPolicy policy = 5;
  HistoryCoverage coverage = 6;
  uint32 scanned_commits = 7;
  repeated PathHistoryEntry entries = 8; // Changed states, newest first.
  // First unscanned/boundary revision when incomplete. This is progress only,
  // not a cursor or authority to restart outside the caller's immutable scope.
  CommitId boundary = 9;
}
message BlameRequest {
  ScopeKey scope = 1;
  CommitId revision = 2;
  string path = 3;
  HistoryPolicy policy = 4;
  uint32 max_commits = 5;
}
// Zero-based target line range, [start_line,end_line). Lines include their LF;
// the final non-LF suffix also counts. Original line is zero-based at origin.
// Absent origin is unresolved, never a guessed boundary/root attribution.
message BlameRange {
  uint32 start_line = 1;
  uint32 end_line = 2;
  CommitId origin = 3;
  uint32 original_line = 4;
}
message BlameResult {
  bytes scope_digest = 1;
  bytes index_epoch = 2;
  CommitId revision = 3;
  string path = 4;
  HistoryPolicy policy = 5;
  HistoryCoverage coverage = 6;
  uint32 scanned_commits = 7;
  CommitId boundary = 8;
  tinytree.v1.ObjectDescriptor target = 9; // Verified raw FILE descriptor.
  bytes target_bytes = 10; // Only selected FILE bytes, never historical bodies.
  repeated BlameRange ranges = 11; // Exact partition of selected file lines.
}

// Case-sensitive non-overlapping literal byte matches in regular FILE entries.
// Patterns are nonempty, at most 1024 bytes and contain no LF. Symlinks are not
// followed; a resolved tree may be searched regardless of commit parent count.
enum SearchPolicy {
  SEARCH_POLICY_UNSPECIFIED = 0;
  LITERAL_BYTES_V1 = 1;
}
enum SearchCoverage {
  SEARCH_COVERAGE_UNSPECIFIED = 0;
  SEARCH_COMPLETE = 1;
  SEARCH_MORE = 2;
  SEARCH_WARMING = 3;
  SEARCH_READ_LIMIT = 4;
  SEARCH_WORK_LIMIT = 5;
  SEARCH_PRIVATE_OVERLAY = 6;
  SEARCH_CONFLICT = 7;
  SEARCH_INDEX_LIMIT = 8;
}
message SearchRequest {
  ScopeKey scope = 1;
  CommitId revision = 2;
  bytes pattern = 3;
  // Empty means all regular files; otherwise exact canonical directory prefix
  // or a complete file path. No dot/empty components, backslash or NUL.
  string path_prefix = 4;
  SearchPolicy policy = 5;
  uint32 page_size = 6; // Zero uses server default; fixed across a continuation.
  bytes cursor = 7; // Opaque authenticated server token, never object authority.
}
message SearchHit {
  string path = 1;
  bytes file_id = 2; // Exact canonical32; metadata, not a file-read capability.
  uint64 file_size = 3;
  uint64 byte_offset = 4;
  uint32 match_bytes = 5;
  uint64 line = 6; // One-based; LF delimits lines, arbitrary body bytes allowed.
  uint64 byte_column = 7; // Zero-based byte offset from this line's start.
  uint64 snippet_offset = 8; // Absolute FILE offset of bounded snippet bytes.
  bytes snippet = 9; // Includes entire match and at most128 context bytes/side.
}
message SearchResult {
  bytes scope_digest = 1; // Exact32 from selected scope.
  bytes index_epoch = 2; // Exact16 from selected scope.
  CommitId revision = 3;
  bytes root_tree = 4; // Exact32 after canonical source validation, else empty.
  bytes manifest_digest = 5; // Exact32 only when complete manifest is available.
  bytes pattern = 6;
  string path_prefix = 7;
  SearchPolicy policy = 8;
  SearchCoverage coverage = 9;
  repeated SearchHit hits = 10; // Strict (path UTF-8 bytes, byte_offset) order.
  bytes cursor = 11; // Nonempty iff MORE; repeated token returns identical page.
  uint64 entries_examined = 12; // Cumulative; includes repeated candidate reads.
  uint64 file_bytes_read = 13; // Cumulative actual candidate payloads opened.
  uint32 page_size = 14; // Effective fixed result cap, echoed for validation.
}
