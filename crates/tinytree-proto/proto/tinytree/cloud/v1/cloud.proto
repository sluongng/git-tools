syntax = "proto3";
package tinytree.cloud.v1;

import "tinytree/v1/repository.proto";

// Private workspace history. Ownership comes exclusively from authentication.
// OP/VIEW semantic IDs and selected raw encodings are separate hash domains.
service WorkspaceCloud {
  rpc PutObject(PutObjectRequest) returns (WriteReceipt);
  // Explicit raw representation, without replacing first-writer selection.
  rpc PutObjectRepresentation(PutObjectRequest) returns (WriteReceipt);
  rpc ReadObjectRepresentation(ReadObjectRepresentationRequest) returns (stream ObjectChunk);
  rpc PutIndexArtifact(PutIndexArtifactRequest) returns (IndexArtifactWriteReceipt);
  rpc LookupIndexArtifacts(LookupIndexArtifactsRequest) returns (LookupIndexArtifactsResponse);
  rpc ReadIndexArtifact(ReadIndexArtifactRequest) returns (stream IndexArtifactChunk);
  rpc LookupObjects(LookupObjectsRequest) returns (LookupObjectsResponse);
  rpc ReadObject(ReadObjectRequest) returns (stream ObjectChunk);
  rpc PublishVersion(PublishVersionRequest) returns (Publication);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc GetVersion(GetVersionRequest) returns (Version);
  // Greatest logical capture sequence, not the most recently published version.
  rpc GetLatestCapturedVersion(GetLatestCapturedVersionRequest) returns (Version);
  rpc ReadCapture(ReadCaptureRequest) returns (stream CaptureChunk);
  rpc ReadNativeClosure(ReadNativeClosureRequest) returns (stream NativeClosureChunk);
  rpc GetPublication(GetPublicationRequest) returns (GetPublicationResponse);
  // Durable owner-scoped job pins; replay the same nonce to retain its original
  // selection. Release is explicit, never implicit on shutdown or restore Ready.
  rpc AcquireVersionPin(AcquireVersionPinRequest) returns (VersionPin);
  rpc ReleaseVersionPin(ReleaseVersionPinRequest) returns (VersionPinReleased);
}
enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OPERATION = 1;
  VIEW = 2;
}
message ObjectId {
  ObjectKind kind = 1;
  bytes semantic_id = 2; // Exactly 64 bytes; not a native commit ID.
}
message RawDigest {
  bytes blake3 = 1; // Exactly 32 bytes, over selected raw OP/VIEW protobuf.
  uint64 size_bytes = 2;
}
message ObjectDescriptor {
  ObjectId id = 1;
  RawDigest selected = 2;
}
message PutObjectRequest {
  string repository_id = 1;
  ObjectDescriptor descriptor = 2;
  bytes payload = 3;
}
message WriteReceipt {
  ObjectDescriptor descriptor = 1;
  string staging_lease = 2;
  int64 expires_at_unix_seconds = 3;
}
message LookupObjectsRequest {
  string repository_id = 1;
  repeated ObjectId ids = 2;
}
message ObjectSelection { optional ObjectDescriptor descriptor = 1; }
message LookupObjectsResponse { repeated ObjectSelection selections = 1; }
message ReadObjectRequest {
  string repository_id = 1;
  ObjectId id = 2;
}
message ReadObjectRepresentationRequest {
  string repository_id = 1;
  ObjectDescriptor descriptor = 2;
}
message ObjectChunk {
  ObjectDescriptor descriptor = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
}
message Workspace {
  bytes workspace_id = 1; // Exactly 32 bytes, scoped to authenticated owner/repo.
  uint64 generation = 2;
  optional bytes manifest_id = 3; // Exactly 32 bytes when present.
}
message Publication {
  string idempotency_key = 1;
  Workspace workspace = 2;
}
// Explicit V2 replay namespace. An absent identity always uses the opaque legacy
// key namespace, even when the key text resembles a V2 token.
message PublicationIdentity {
  bytes workspace_id = 1; // Exactly 32 bytes.
  uint64 target_generation = 2; // Positive; expected_generation + 1 on publish.
  bytes nonce = 3; // Exactly 16 bytes.
}
message PublishVersionRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
  uint64 expected_generation = 3;
  string idempotency_key = 4;
  bytes manifest_id = 5; // Domain-separated manifest ID, not raw BLAKE3.
  bytes manifest = 6; // Canonical tinytree-cloud manifest encoding.
  repeated string staging_leases = 7;
  bytes capture_data = 8; // Canonical capture DATA, required by manifest v3.
  PublicationIdentity publication_identity = 9; // Requires STRUCTURED_CLOUD_PUBLICATION_V2.
  // With identity, idempotency_key is its exact r2-<workspace hex64>-<generation
  // hex16>-<nonce hex32> display token. The server never infers identity from text.
}
message GetWorkspaceRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
}
message GetLatestCapturedVersionRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
}
message GetVersionRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
  uint64 generation = 3;
}
message Version {
  bytes workspace_id = 1;
  uint64 generation = 2;
  bytes manifest_id = 3;
  optional bytes previous_manifest_id = 4;
  bytes manifest = 5;
  NativeVersionAuthority native_authority = 6;
}
message GetPublicationRequest {
  string repository_id = 1;
  string idempotency_key = 2;
  PublicationIdentity publication_identity = 3; // Same exact token binding as publish.
}
message GetPublicationResponse { optional Publication publication = 1; }

// Portable logical-index artifacts are not OP/VIEW64 or native object IDs.
enum IndexArtifactKind {
  INDEX_ARTIFACT_KIND_UNSPECIFIED = 0;
  ROOT = 1;
  NODE = 2;
}
message IndexArtifactId {
  IndexArtifactKind kind = 1;
  bytes semantic_id = 2; // Exactly 32 bytes in the root/node identity domain.
}
message IndexArtifactDescriptor {
  IndexArtifactId id = 1;
  RawDigest selected = 2;
}
message PutIndexArtifactRequest {
  string repository_id = 1;
  IndexArtifactDescriptor descriptor = 2;
  bytes payload = 3;
}
message IndexArtifactWriteReceipt {
  IndexArtifactDescriptor descriptor = 1;
  string staging_lease = 2;
  int64 expires_at_unix_seconds = 3;
}
message LookupIndexArtifactsRequest {
  string repository_id = 1;
  repeated IndexArtifactId ids = 2;
}
message IndexArtifactSelection {
  optional IndexArtifactDescriptor descriptor = 1;
}
message LookupIndexArtifactsResponse {
  repeated IndexArtifactSelection selections = 1;
}
message ReadIndexArtifactRequest {
  string repository_id = 1;
  IndexArtifactId id = 2;
}
message IndexArtifactChunk {
  IndexArtifactDescriptor descriptor = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
}

// Stateless authority. The server always reauthenticates and reacquires the
// exact retained version; these fields do not grant generic repository access.
message RetainedVersionSelector {
  bytes workspace_id = 1;
  uint64 generation = 2;
  bytes manifest_id = 3;
}
message NativeVersionAuthority {
  uint32 version = 1;
  bytes owner_binding = 2;
  bytes binding_digest = 3;
  RawDigest manifest_selected = 4;
}
message SnapshotCommitTerminal {
  repeated bytes index_root_ids = 1;
  bytes commit_id = 2;
}
message NativeClosureProof {
  oneof terminal {
    tinytree.v1.ObjectKey version_root = 1;
    SnapshotCommitTerminal snapshot_commit = 2;
  }
  // Excludes terminal. Each key must be an actual direct canonical reference
  // of its predecessor. An empty path reads the terminal itself.
  repeated tinytree.v1.ObjectKey edge_path = 3;
}
message ReadNativeClosureRequest {
  string repository_id = 1;
  RetainedVersionSelector selector = 2;
  NativeVersionAuthority authority = 3;
  tinytree.v1.ObjectKey requested = 4;
  NativeClosureProof proof = 5;
}
message NativeClosureChunk {
  tinytree.v1.ObjectDescriptor descriptor = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
  bytes source_binding_digest = 5;
}

message CaptureDescriptor {
  bytes capture_id = 1; // Domain-separated capture DATA ID, exactly 32 bytes.
  RawDigest selected = 2;
}
message ReadCaptureRequest {
  string repository_id = 1;
  RetainedVersionSelector selector = 2;
  bytes expected_capture_id = 3;
  RawDigest manifest_selected = 4; // Exact selected manifest; not an auth grant.
}
message CaptureChunk {
  CaptureDescriptor descriptor = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool eof = 4;
  bytes manifest_id = 5; // Mandatory echo of the exact retained selector.
}

// Discovery summaries are not retention leases. Select exact GetVersion before
// restore to obtain and verify the complete manifest and its selected digest.
message ListWorkspacesRequest {
  string repository_id = 1;
  uint32 page_size = 2; // Required, 1..128; fixed across continuation.
  bytes continuation = 3;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1; // Ordered by unsigned workspace ID bytes.
  bytes continuation = 2; // Empty iff this owner-scoped scan is exhausted.
}
message ListVersionsRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
  uint32 page_size = 3; // Required, 1..128; fixed across continuation.
  bytes continuation = 4;
}
message VersionSummary {
  bytes workspace_id = 1;
  uint64 generation = 2;
  bytes manifest_id = 3;
  optional bytes previous_manifest_id = 4;
}
message ListVersionsResponse {
  Workspace workspace = 1; // Current pointer observed for this page.
  repeated VersionSummary versions = 2; // Ascending generation.
  bytes continuation = 3;
  uint64 through_generation = 4; // Frozen initial current generation ceiling.
  uint64 retired_through = 5; // First retained generation is this floor + 1.
  uint64 retention_revision = 6; // Changes atomically with the floor; cursor bound.
}

message ExactVersionSelection {
  RetainedVersionSelector version = 1;
  RawDigest manifest_selected = 2;
}
message AcquireVersionPinRequest {
  string repository_id = 1;
  bytes workspace_id = 2;
  bytes pin_id = 3; // Exactly 16 bytes; nonce plus admission expiry is one identity.
  oneof selection {
    bool latest_captured = 4; // Must be true. Replay never reselects latest.
    uint64 generation = 5; // Positive, exact generation.
    ExactVersionSelection exact = 6;
  }
  int64 acquire_not_after_unix_seconds = 7; // Immutable admission fence, not a pin TTL.
}
message VersionPin {
  bytes pin_id = 1;
  Version version = 2; // Fully checked retained selection committed before reply.
  int64 acquire_not_after_unix_seconds = 3;
}
message ReleaseVersionPinRequest {
  string repository_id = 1;
  bytes pin_id = 2;
  ExactVersionSelection exact = 3;
  int64 acquire_not_after_unix_seconds = 4;
}
message VersionPinReleased {
  bytes pin_id = 1;
  int64 acquire_not_after_unix_seconds = 2;
}
