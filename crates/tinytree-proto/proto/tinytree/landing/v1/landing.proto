syntax = "proto3";
package tinytree.landing.v1;
import "tinytree/v1/repository.proto";

// Landing intent/status. Configured server checks may publish automatically.
// Clients cannot submit verdicts or request unchecked publication.
service Landing {
  rpc StartLanding(StartLandingRequest) returns (LandingResponse);
  rpc GetLanding(GetLandingRequest) returns (LandingResponse);
  rpc RecoverLanding(RecoverLandingRequest) returns (LandingResponse);
}
message StartLandingRequest {
  string repository_id = 1;
  string idempotency_key = 2;
  bytes source_base = 3; // Exactly 32 bytes, including the intrinsic root.
  bytes source_head = 4;
  string destination = 5;
  uint64 expected_generation = 6;
  bytes expected_head = 7;
  string profile_name = 8;
  string expected_profile_version = 9;
}
message GetLandingRequest {
  string repository_id = 1;
  string idempotency_key = 2;
}
// One recover-only quantum of the server's exact first saved attempt.
message RecoverLandingRequest {
  string repository_id = 1;
  string idempotency_key = 2;
  bytes expected_job_id = 3;
  uint32 expected_attempts = 4;
  uint32 expected_recoveries = 5;
}
message LandingResponse {
  LandingJob job = 1;
  string repository_id = 2;
  string idempotency_key = 3;
}
enum Phase {
  PHASE_UNSPECIFIED = 0;
  INTENT = 1;
  PREPARED_PENDING_CHECKS = 2;
  CHECKED = 3;
  COMMITTED = 4;
  CONFLICT = 5;
  UNSUPPORTED = 6;
  CHECK_FAILED = 7;
  STALE_TARGET = 8;
  EXPIRED = 9;
  // Trusted checks permanently stopped without a verdict. No publication receipt.
  CHECK_UNAVAILABLE = 10;
}
enum PreparationAvailability {
  PREPARATION_UNSPECIFIED = 0;
  PROFILE_CONFIGURED = 1;
  PROFILE_UNAVAILABLE = 2;
  PREPARATION_DISABLED = 3;
}
message Rewrite {
  bytes old_commit = 1;
  bytes new_commit = 2;
  bytes change_id = 3; // 16-byte native ChangeId.
}
message Candidate {
  bytes head = 1;
  bytes root_tree = 2;
  // Non-identity relations only; unchanged commits are not evolution edges.
  repeated Rewrite rewrites = 3;
}
message Receipt {
  tinytree.v1.Reference reference = 1;
  repeated Rewrite rewrites = 2;
  bytes evidence = 3;
}
message LandingJob {
  bytes id = 1;
  Phase phase = 2;
  bool roots_retained = 3;
  int64 expires_at_seconds = 4;
  string profile_name = 5;
  string profile_version = 6;
  Candidate candidate = 7;
  Receipt receipt = 8;
  optional string conflict_path = 9;
  // Current configuration readiness, not a check verdict. Accepted intent
  // authorization is frozen; removing a launch grant does not cancel the job.
  PreparationAvailability preparation = 10;
  optional CheckerProgress checker_progress = 11;
}

// Ephemeral exact-job diagnostics, not execution evidence or a verdict.
enum CheckerStage {
  CHECKER_STAGE_UNSPECIFIED = 0;
  RESERVATION = 1;
  RESERVATION_DIRECTORY = 2;
  AUTHORITY_REFRESH = 3;
  CANDIDATE_PIN = 4;
  RESERVATION_PERSIST = 5;
  QUEUED = 6;
  PREPARATION = 7;
  BINARY_VERIFY = 8;
  CONFIGURATION_VERIFY = 9;
  ENVIRONMENT_BINDING = 10;
  EXECUTION = 11;
  RECEIPT_VERIFY = 12;
  VERDICT_APPLY = 13;
}
enum CheckerErrorCode {
  CHECKER_ERROR_NONE = 0;
  RESERVATION_FAILED = 1;
  PROCESS_FAILED = 2;
  EXECUTION_UNCERTAIN = 3;
  RECEIPT_INVALID = 4;
}
enum CheckerSavedPhase {
  CHECKER_SAVED_PHASE_UNSPECIFIED = 0;
  SAVED_RESERVED = 1;
  SAVED_DISPATCH_INTENT = 2;
  SAVED_UNCERTAIN = 3;
  SAVED_VERIFIED = 4;
  SAVED_RETRY_READY = 5;
  SAVED_TERMINAL = 6;
  SAVED_UNAVAILABLE_READY = 7;
}
message CheckerProgress {
  CheckerStage stage = 1;
  // Owned host task only; does not assert that a child process was spawned.
  bool active_task = 2;
  uint32 attempts = 3;
  uint32 recoveries = 4;
  int64 retry_at_seconds = 5;
  CheckerErrorCode error_code = 6;
  CheckerStage error_stage = 7;
  // Current phase from the existing durable record, not a new stored field.
  CheckerSavedPhase saved_phase = 8;
  // Exact automatic uncertain-recovery budget stop; not permission to retry.
  bool automatic_recovery_blocked = 9;
}
