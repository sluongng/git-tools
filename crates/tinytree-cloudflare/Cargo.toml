[package]
name = "tinytree-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded canonical repository validation for WebAssembly hosts"

[dependencies]
tinytree-forge-core = { path = "../tinytree-forge-core" }
tinytree-model = { path = "../tinytree-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tinytree-store = { path = "../tinytree-store" }
tempfile = "3"
