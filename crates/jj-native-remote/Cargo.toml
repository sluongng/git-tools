[package]
name = "jj-native-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Broker-hosted lazy native repository I/O and durable remote admission"

[dependencies]
private-fs = { path = "../private-fs" }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
fjall = "=3.1.12"
fs2 = "0.4"
futures = "0.3"
jj-lib = { version = "=0.46.0", default-features = false }
jj-native-backend = { path = "../jj-native-backend" }
local-cas = { path = "../local-cas" }
native-broker = { path = "../native-broker" }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tinytree-client = { path = "../tinytree-client" }
tinytree-cloud = { path = "../tinytree-cloud" }
tinytree-model = { path = "../tinytree-model" }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tonic = "0.14"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jj-native-index = { path = "../jj-native-index" }
tinytree-index = { path = "../tinytree-index" }
output-core = { path = "../output-core" }
native-workspace = { path = "../native-workspace" }
async-stream = "0.3"
tinytree-fixture = { path = "../tinytree-fixture" }
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }
tokio-stream = { version = "0.1", features = ["net"] }
