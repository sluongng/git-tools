# This profile is selected by trusted broker configuration, not incoming RPCs.
authorization_profile = "agent-profile"
operation_timeout_ms = 120000
max_ledger_bytes = 33554432
max_upload_spool_bytes = 134217728

[remote]
endpoint = "http://127.0.0.1:8093"
repository_id = "example"
token_env = "TINYTREE_AGENT_TOKEN"
compression = true

[closure]
max_objects = 5000
max_edges = 50000
max_metadata_bytes = 16777216
max_path_contexts = 5000
max_path_context_bytes = 2097152

[query]
max_scopes = 32
max_queries = 64
max_replays = 4096
max_registry_bytes = 67108864
max_authorities = 256
max_grants = 50000
expiry_interval_ms = 1000
