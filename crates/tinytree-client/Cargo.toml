[package]
name = "tinytree-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded verifying native repository gRPC client"

[dependencies]
private-fs = { path = "../private-fs" }
async-stream = "0.3"
blake3 = "1"
getrandom = "0.3"
bytes = "1"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = "0.3"
prost = "0.14"
reapi = { path = "../reapi" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tinytree-model = { path = "../tinytree-model" }
tinytree-proto = { path = "../tinytree-proto" }
tinytree-search = { path = "../tinytree-search" }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tonic = { version = "0.14", features = ["zstd", "tls-ring"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jj-lib = { version = "=0.46.0", default-features = false }
tinytree-cloud = { path = "../tinytree-cloud" }
tinytree-index = { path = "../tinytree-index" }
futures-util = "0.3"
tinytree-server = { path = "../tinytree-server" }
tinytree-store = { path = "../tinytree-store" }
tinytree-fixture = { path = "../tinytree-fixture" }
tokio-stream = { version = "0.1", features = ["net"] }
