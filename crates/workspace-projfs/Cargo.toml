[package]
name = "workspace-projfs"
version = "0.1.0"
edition = "2024"
description = "Writable Windows ProjFS projection of a Git partial clone"
license = "MIT"

[features]
default = ["native"]
native = ["dep:windows-sys"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
workspace-core = { path = "../workspace-core" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_Storage_FileSystem", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

# Keep the public executable name independent of the package name.
[[bin]]
name = "git-projfs"
path = "src/main.rs"
