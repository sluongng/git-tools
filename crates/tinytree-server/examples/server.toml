# Keep data/config outside the source checkout. Replace the storage location.
storage = "/var/tmp/tinytree-data"
listen = "127.0.0.1:8093"
repositories = ["example"]
gc_interval_seconds = 300

[[principals]]
id = "agent"
token_env = "TINYTREE_AGENT_TOKEN"
repositories = ["example"]
write = true
retain = true

[service]
max_inflight = 16
max_inflight_per_repository = 4
max_frame_bytes = 65536

# Rebuildable graph index; queries never delay canonical uploads or publication.
# Scope handles expire; clients reopen their immutable roots after expiry/restart.
[service.query]
scope_ttl_seconds = 300
max_scopes_per_principal = 16
max_scope_replays_per_principal = 256
max_overlay_memory_bytes = 134217728
max_scope_overlay_bytes = 16777216
max_scope_overlay_nodes = 4096
max_overlay_layers = 32
query_ttl_seconds = 120
max_queries_per_principal = 8
max_query_replays_per_principal = 128
max_cursor_memory_bytes = 134217728
max_page_size = 128
# Fixed-path linear history/blame return explicit incomplete coverage at limits.
max_history_commits = 256
max_history_object_bytes = 1048576
max_history_read_bytes = 16777216
max_history_path_depth = 128
max_blame_file_bytes = 262144
max_blame_lines = 16384
# Aggregate comparison work; one bounded scratch allocation charge per diff.
max_blame_diff_steps = 16000000
max_blame_diff_memory_bytes = 8388608
max_blame_diff_depth = 64
# Selected graph lookahead/edges and cumulative reduction work are bounded.
max_graph_query_nodes = 8192
max_graph_query_edges = 8192
max_graph_query_steps = 4000000
max_pending_warms = 32
max_warm_jobs = 1
# Retained raw payload cache versus total discovery and cache-miss read work.
max_warm_bytes = 16777216
max_warm_read_bytes = 268435456
# Increment and restart for an explicit fresh index; old data is retained.
index_rebuild_generation = 0

# Non-loopback TCP additionally requires TLS identities supplied separately.
# [tls]
# certificate = "/path/to/certificate.pem"
# private_key = "/path/to/private-key.pem"
