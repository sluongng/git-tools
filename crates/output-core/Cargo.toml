[package]
name = "output-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable generation-aware lazy CAS output namespace and verified disk cache"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
fjall = "=3.1.12"
im = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
