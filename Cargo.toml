[workspace]
members = [
    "crates/agent-session",
    "crates/workspace-core",
    "crates/workspace-overlay",
    "crates/workspace-fuse",
    "crates/git-pack-cache",
    "crates/reapi",
    "crates/git-proxy",
    "crates/workspace-projfs",
    "crates/bazel-output-service",
    "crates/workspace-nfs",
    "crates/jj-vfs",
    "crates/output-core",
    "crates/output-nfs",
    "crates/output-projfs",
    "crates/local-cas",
    "crates/output-fuse",
]
exclude = ["third_party/fuser", "third_party/nfsserve"]
resolver = "3"

[patch.crates-io]
fuser = { path = "third_party/fuser" }
